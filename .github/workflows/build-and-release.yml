name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build the extension
        run: npm run build

      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-colorize-vsix
          path: "*.vsix"
          if-no-files-found: error

  release:
    name: Release major version
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read and validate the version
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          if [[ ! "$version" =~ ^[1-9][0-9]*\.0\.0$ ]]; then
            echo "Version $version is not a major release (X.0.0); skipping the release."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping it."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download the VSIX
        if: steps.version.outputs.create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vscode-colorize-vsix
          path: dist

      - name: Create the GitHub release
        if: steps.version.outputs.create == 'true'
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          dist/*.vsix
          --target "$GITHUB_SHA"
          --title "${{ steps.version.outputs.tag }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
